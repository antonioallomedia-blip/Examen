name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept remaining licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make --stacktrace

          mkdir -p $GITHUB_WORKSPACE/builds
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \;

          cd $GITHUB_WORKSPACE/builds
          PLUGIN_FILE=$(ls *.cs3 | head -1)
          PLUGIN_NAME="${PLUGIN_FILE%.cs3}"

          printf '[\n  {\n    "name": "HanimeTV",\n    "internalName": "%s",\n    "version": 1,\n    "description": "Hanime.tv provider for CloudStream.",\n    "authors": ["antonioallomedia-blip"],\n    "repositoryUrl": "https://github.com/antonioallomedia-blip/Examen",\n    "status": 1,\n    "tvTypes": ["Movie"],\n    "language": "en",\n    "iconUrl": "https://hanime.tv/favicon.ico",\n    "url": "https://raw.githubusercontent.com/antonioallomedia-blip/Examen/builds/%s"\n  }\n]\n' "$PLUGIN_NAME" "$PLUGIN_FILE" > plugins.json

          echo "=== plugins.json content ==="
          cat plugins.json

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force